project:
  type: book
  execute-dir: project
  output-dir: docs

execute:
  freeze: auto

knitr:
  opts_chunk:
    dev: "ragg_png"

book:
  title: "Fauquier Housing Needs Assessment"
  subtitle: "Fauquier County, the Town of Warrenton, and Bealeton"
  repo-url: https://github.com/hdadvisors/fhfh
  output-file: "fhfh-housing-needs-assessment"
  author:
    - name: HDAdvisors
      url: https://hdadvisors.net/
  date: today
  date-format: long
  chapters:
    - index.qmd
    - exec-sum.qmd
    - inventory.qmd
    - demographics.qmd
    - market-ownership.qmd
    - market-rental.qmd
    - gaps.qmd
    - populations.qmd
    - projections.qmd
    - conclusions.qmd
  appendices:
    - data-notes.qmd

format:
  html:
    theme:
      - lumen
    grid:
      sidebar-width: 275px
    fontsize: "100%"
    toc-title: "On this page"
    number-depth: 2
    reference-location: margin
    footnotes-hover: false
    crossrefs-hover: false
    html-table-processing: none

# PDF route — prototyped in Session 12, NOT adopted. Findings and recommendation in
# PLAN.md §11 (2026-07-28). To reproduce the test, uncomment the typst block below *and*
# add `prefer-html: true` at the top level of this file (kableExtra emits HTML, which typst
# rejects outright — 5 of 9 chapters hard-fail without it), then `quarto render --to typst`.
# A typst render clears docs/, so re-run plain `quarto render` afterwards to restore the site.
#
#  typst:
#    papersize: us-letter
#    margin:
#      x: 1in
#      y: 1in
#    fontsize: 10pt
#    number-depth: 2
#    keep-typ: true
